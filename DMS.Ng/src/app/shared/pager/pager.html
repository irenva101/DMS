<div class="pager-spacer"></div>
<div class="pager">
  <button type="button" (click)="previous()" [disabled]="page() === 1" aria-label="Prethodna strana">
    <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 6 10.5l6.5 6"/></svg>
  </button>
  <span class="pager-status">Strana {{ page() }} od {{ totalPages() }}</span>
  <button type="button" (click)="next()" [disabled]="page() === totalPages()" aria-label="Sledeća strana">
    <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5l6.5 6-6.5 6"/></svg>
  </button>
</div>
